<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rufo Clerk test</title>
</head>
<body>
  <div id="status">loading clerk...</div>
  <div id="sign-in"></div>
  <div id="signed-in" style="display:none">
    <p>Signed in.</p>
    <button id="make-org">Create + activate test org</button>
    <button id="deploy-agent">Deploy langgraph-real-agent</button>
    <button id="list-deployments">List deployments</button>
    <button id="get-costs">Get costs</button>
    <pre id="output" style="white-space: pre-wrap; border: 1px solid #ccc; padding: 8px; width: 90%;"></pre>
  </div>

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_Z3VpZGluZy1lZWwtMTEuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://guiding-eel-11.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>

  <script>
    const CP_BASE = 'http://localhost:8200';

    async function authedFetch(path, opts) {
      const token = await window.Clerk.session.getToken();
      opts = opts || {};
      opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + token });
      return fetch(CP_BASE + path, opts);
    }

    window.addEventListener('load', async () => {
      await window.Clerk.load();
      document.getElementById('status').textContent = 'clerk loaded';

      function render() {
        if (window.Clerk.user) {
          document.getElementById('sign-in').style.display = 'none';
          document.getElementById('signed-in').style.display = 'block';
          document.getElementById('status').textContent = 'signed in as ' + window.Clerk.user.primaryEmailAddress?.emailAddress + ' / org ' + window.Clerk.organization?.id;
        } else {
          window.Clerk.mountSignIn(document.getElementById('sign-in'));
        }
      }
      render();
      window.Clerk.addListener(render);

      document.getElementById('make-org').addEventListener('click', async () => {
        try {
          const org = await window.Clerk.createOrganization({ name: 'rufo-e2e-test-org-2' });
          await window.Clerk.setActive({ organization: org.id });
          document.getElementById('output').textContent = 'active org: ' + org.id;
        } catch (e) {
          document.getElementById('output').textContent = 'org error: ' + e.message;
        }
      });

      document.getElementById('deploy-agent').addEventListener('click', async () => {
        document.getElementById('output').textContent = 'deploying...';
        const resp = await authedFetch('/api/deployments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            agent_name: 'langgraph-real-agent',
            image: 'us-central1-docker.pkg.dev/rufo-cloud-06179/rufo-agents/langgraph-real-agent:latest',
            port: 8080,
            secret_env_from_server: ['OPENAI_API_KEY'],
          }),
        });
        const body = await resp.json();
        document.getElementById('output').textContent = JSON.stringify({ status: resp.status, body }, null, 2);
      });

      document.getElementById('list-deployments').addEventListener('click', async () => {
        const resp = await authedFetch('/api/deployments');
        const body = await resp.json();
        document.getElementById('output').textContent = JSON.stringify({ status: resp.status, body }, null, 2);
      });

      document.getElementById('get-costs').addEventListener('click', async () => {
        document.getElementById('output').textContent = 'loading costs...';
        const resp = await authedFetch('/api/costs?window_hours=24');
        const body = await resp.json();
        document.getElementById('output').textContent = JSON.stringify({ status: resp.status, body }, null, 2);
      });
    });
  </script>
</body>
</html>
