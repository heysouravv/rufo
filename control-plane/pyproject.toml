[project]
name = "rufo-control-plane"
version = "0.1.0"
description = "Rufo Cloud control plane: Clerk-authenticated API that deploys agents to Cloud Run"
requires-python = ">=3.11"
dependencies = [
    "rufo-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-cloud-run>=0.10",
    "google-cloud-artifact-registry>=1.14",
    "google-cloud-build>=3.24",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rufo_control_plane"]

[tool.uv.sources]
rufo-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
