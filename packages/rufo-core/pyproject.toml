[project]
name = "rufo-core"
version = "0.1.0"
description = "Policy-as-code engine for AI agent tool calls"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "simpleeval>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rufo_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
