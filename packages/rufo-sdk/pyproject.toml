[project]
name = "rufo-sdk"
version = "0.1.0"
description = "Framework adapters (LangChain, LangGraph, generic) for the Rufo policy engine"
requires-python = ">=3.11"
dependencies = [
    "rufo-core",
    "requests>=2.31",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rufo_sdk"]

[tool.uv.sources]
rufo-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
