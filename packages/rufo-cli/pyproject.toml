[project]
name = "rufo-cli"
version = "0.1.0"
description = "Command-line interface for deploying and operating Rufo-managed agents"
requires-python = ">=3.11"
dependencies = [
    "rufo-core",
    "typer>=0.13",
    "rich>=13.9",
    "requests>=2.31",
]

[project.scripts]
rufo = "rufo_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rufo_cli"]

[tool.uv.sources]
rufo-core = { workspace = true }
