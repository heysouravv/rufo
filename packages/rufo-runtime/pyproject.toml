[project]
name = "rufo-runtime"
version = "0.1.0"
description = "Deployment runtime that hosts an agent behind the Rufo policy engine, approval queue, and audit log"
requires-python = ">=3.11"
dependencies = [
    "rufo-core",
    "rufo-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rufo_runtime"]

[tool.uv.sources]
rufo-core = { workspace = true }
rufo-sdk = { workspace = true }
